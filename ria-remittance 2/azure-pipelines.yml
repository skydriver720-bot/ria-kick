# ==============================================================================
# RIA Remittance — Single Operation Azure Pipeline
# Strictly executes ONLY 1 operation at a time based on user selection:
#   - Plan           : Runs Bicep what-if dry-run
#   - Deploy         : Creates / Updates infrastructure via Bicep
#   - DeleteResource : Deletes a single specified resource from the Resource Group
# ==============================================================================

trigger: none  # Manual trigger only

# ─── Runtime Parameters (Select Exactly 1 Operation) ──────────────────────────

parameters:
  - name: operation
    displayName: "Select 1 Operation to Execute"
    type: string
    default: "Plan"
    values:
      - "Plan"
      - "Deploy"
      - "DeleteResource"

  - name: resourceGroupName
    displayName: "Resource Group Name"
    type: string
    default: "rg-ria-remittance-dev"

  # Required ONLY if operation == 'DeleteResource'
  - name: targetResourceType
    displayName: "[For Delete Only] Resource Type"
    type: string
    default: "Microsoft.Storage/storageAccounts"
    values:
      - "Microsoft.Storage/storageAccounts"
      - "Microsoft.KeyVault/vaults"
      - "Microsoft.Network/virtualNetworks"
      - "Microsoft.ManagedIdentity/userAssignedIdentities"
      - "Microsoft.ServiceBus/namespaces"

  - name: targetResourceName
    displayName: "[For Delete Only] Resource Name"
    type: string
    default: "riastdev001"

# ─── Global Variables ─────────────────────────────────────────────────────────

variables:
  azureServiceConnection: "sc-ria-remittance-azure"
  bicepTemplateFile: "infrastructure/bicep/main.bicep"
  bicepParameterFile: "infrastructure/bicep/parameters/dev.bicepparam"

# ─── Stages (Strictly Runs Only the Selected Operation) ───────────────────────

stages:

  # ----------------------------------------------------------------------------
  # OPTION 1: PLAN (What-If Preview Only)
  # ----------------------------------------------------------------------------
  - stage: ExecutePlan
    displayName: "Operation: Plan (What-If)"
    condition: eq('${{ parameters.operation }}', 'Plan')
    jobs:
      - job: RunPlan
        displayName: "What-If Dry Run"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: "Execute Bicep What-If"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                echo "Running What-If Preview on Resource Group: ${{ parameters.resourceGroupName }}"
                az deployment group what-if \
                  --resource-group "${{ parameters.resourceGroupName }}" \
                  --template-file  "$(bicepTemplateFile)" \
                  --parameters     "$(bicepParameterFile)"

  # ----------------------------------------------------------------------------
  # OPTION 2: DEPLOY (Create / Update Services Only)
  # ----------------------------------------------------------------------------
  - stage: ExecuteDeploy
    displayName: "Operation: Deploy Services"
    condition: eq('${{ parameters.operation }}', 'Deploy')
    jobs:
      - job: RunDeploy
        displayName: "Deploy Infrastructure"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - task: AzureCLI@2
            displayName: "Deploy Bicep Template"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                echo "Deploying Bicep to Resource Group: ${{ parameters.resourceGroupName }}"
                az deployment group create \
                  --resource-group "${{ parameters.resourceGroupName }}" \
                  --template-file  "$(bicepTemplateFile)" \
                  --parameters     "$(bicepParameterFile)" \
                  --mode           Incremental
                echo "Deployment completed successfully."

  # ----------------------------------------------------------------------------
  # OPTION 3: DELETE RESOURCE (Targeted Deletion of 1 Service Only)
  # ----------------------------------------------------------------------------
  - stage: ExecuteDelete
    displayName: "Operation: Delete 1 Service"
    condition: eq('${{ parameters.operation }}', 'DeleteResource')
    jobs:
      - job: RunDelete
        displayName: "Delete Resource"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "Delete Single Resource"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                NAME="${{ parameters.targetResourceName }}"
                TYPE="${{ parameters.targetResourceType }}"
                RG="${{ parameters.resourceGroupName }}"

                if [ -z "$NAME" ]; then
                  echo "ERROR: Target Resource Name cannot be blank."
                  exit 1
                fi

                echo "Deleting single resource:"
                echo "  Name: $NAME"
                echo "  Type: $TYPE"
                echo "  RG  : $RG"

                az resource delete \
                  --resource-group "$RG" \
                  --name "$NAME" \
                  --resource-type "$TYPE" \
                  --verbose

                echo "Successfully deleted resource: $NAME"